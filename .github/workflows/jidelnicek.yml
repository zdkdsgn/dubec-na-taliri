name: Jídelníček

# Každý všední den ráno stáhne jídelníček ZŠ Dubeč (výchozí appka) i
# všech ostatních škol v registru. Když se něco změnilo, commitne to –
# push na main rovnou přesadí GitHub Pages.
on:
  schedule:
    - cron: "10 4 * * 1-5"      # 06:10 letního / 05:10 zimního času
  workflow_dispatch:            # ruční spuštění tlačítkem v záložce Actions

permissions:
  contents: write

concurrency:
  group: jidelnicek
  cancel-in-progress: false

jobs:
  aktualizace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stáhnout jídelníček Dubče a přegenerovat data.js
        run: python3 tools/update-menu.py

      - name: Stáhnout jídelníček ostatních škol z registru
        # fetch-school.py skončí s chybou, i když se nepodaří přečíst
        # třeba jen 1 z 200+ škol (typicky MŠ, co ještě nemá nový týden
        # vyvěšený) – ať to samo o sobě nezastaví commit a notifikace
        # pro všechny ostatní, co se v pořádku stáhly. Skript sám o sobě
        # už neúspěšné školy ošetřuje správně (nechá jejich data beze
        # změny, nic nepřepíše špatně).
        continue-on-error: true
        run: python3 tools/fetch-school.py --all

      - name: Stáhnout jídelníček MŠ Dubeč (vlastní web, ne jidelna.cz)
        # Nejkřehčí scraper ze všech (žádné API, jen text webu jedné
        # konkrétní školy) – ať jeho pád nezastaví aktualizaci
        # a notifikace pro zbytek registru.
        continue-on-error: true
        run: python3 tools/fetch-ms-dubec.py

      - name: Zjistit, které školy se opravdu změnily
        id: zmeny
        run: |
          zmenene=$(git diff --name-only -- 'schools/*/days.json' \
            | sed -E 's#schools/([^/]+)/days\.json#\1#' | sort -u | tr '\n' ' ')
          echo "ids=$zmenene" >> "$GITHUB_OUTPUT"
          echo "Změněné školy: ${zmenene:-žádné}"

      - name: Commitnout změny
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Jídelníček beze změny, není co commitovat."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js menu/ version.json schools/
          git commit -m "Jídelníček – automatická aktualizace $(date '+%-d. %-m. %Y')"
          git push

      - name: Poslat push notifikace ("nový jídelníček je venku")
        if: steps.zmeny.outputs.ids != ''
        env:
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: python3 tools/notify-push.py ${{ steps.zmeny.outputs.ids }}
